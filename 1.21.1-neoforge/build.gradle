plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

sourceSets {
    main {
        java.srcDir file("${projectDir}/../common/src/main/java")
        resources.srcDir file("${projectDir}/../common/src/main/resources")
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version     : minecraft_version,
            neo_version           : neo_version,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
