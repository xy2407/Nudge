def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def gradleBin = isWindows ? 'gradlew.bat' : './gradlew'

def targets = [
        '1.20.1-forge'   : 'setupForge1201',
        '1.20.1-fabric'  : 'setupFabric1201',
        '1.21.1-neoforge': 'setupNeoForge1211',
        '1.21.1-fabric'  : 'setupFabric1211',
]

def selectedTarget = providers.gradleProperty('target').orNull

if (selectedTarget != null && !targets.containsKey(selectedTarget)) {
    throw new GradleException("Unknown target '${selectedTarget}'. Available: ${targets.keySet().join(', ')}")
}

targets.each { name, taskName ->
    tasks.register(taskName, Exec) {
        group = 'setup'
        description = "Resolves and caches dependencies for ${name} (no compilation)"
        workingDir = file(name)
        commandLine gradleBin, 'dependencies', '--console', 'plain'
    }
}

tasks.register('setup') {
    group = 'setup'
    description = 'Prepares the Gradle environment of every target, or only the one given with -Ptarget='
    if (selectedTarget != null) {
        dependsOn tasks.named(targets[selectedTarget])
    } else {
        targets.values().each { dependsOn tasks.named(it) }
    }
}

tasks.register('variants') {
    group = 'help'
    description = 'Lists every target'
    doLast {
        targets.keySet().each { println " - ${it}" }
    }
}
