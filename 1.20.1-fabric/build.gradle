plugins {
    id 'fabric-loom' version "${loom_version}"
}

sourceSets {
    main {
        java.srcDir file("${projectDir}/../common/src/main/java")
        resources.srcDir file("${projectDir}/../common/src/main/resources")
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    var replaceProperties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            loader_version   : loader_version,
            minecraft_version: minecraft_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target_release.toInteger()
    options.encoding = 'UTF-8'
}
